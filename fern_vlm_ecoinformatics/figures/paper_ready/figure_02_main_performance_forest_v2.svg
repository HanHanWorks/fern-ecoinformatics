<svg xmlns="http://www.w3.org/2000/svg" style="display:block;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" viewBox="0 0 1540 650" role="img" aria-label="Closed-set family performance forest plot">
      <text x="34" y="36" font-size="22" font-weight="700" fill="#162033">30-family closed-set performance on the local 155-image dataset</text>
      <text x="34" y="60" font-size="13" fill="#5f6f86">Solid points show top-1 family accuracy. Horizontal bars show Wilson 95% confidence intervals. Hollow points show top-3 family accuracy.</text>

      <text x="300" y="138" text-anchor="end" font-size="11.5" font-weight="700" fill="#5f6f86">Model</text>
      <text x="1200" y="138" font-size="11.5" font-weight="700" fill="#5f6f86">Top-1 estimate [95% CI]</text>
      <text x="1420" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f6f86">Top-3</text>

      <rect x="330" y="156" width="1140" height="56" fill="#fafbfd"></rect>
      <rect x="330" y="226" width="1140" height="56" fill="#ffffff"></rect>
      <rect x="330" y="296" width="1140" height="56" fill="#fafbfd"></rect>
      <rect x="330" y="366" width="1140" height="56" fill="#ffffff"></rect>
      <rect x="330" y="436" width="1140" height="56" fill="#fafbfd"></rect>

      <line x1="330" y1="132" x2="1150" y2="132" stroke="#d8e1eb"></line>
      <line x1="330" y1="520" x2="1150" y2="520" stroke="#d8e1eb"></line>
      <line x1="1174" y1="132" x2="1174" y2="520" stroke="#d8e1eb"></line>
      <text x="740" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#5f6f86">Family accuracy (%)</text>

      <g font-size="10.5" fill="#5f6f86">
        <line x1="330" y1="132" x2="330" y2="520" stroke="#eef3f8"></line><text x="330" y="544" text-anchor="middle">0</text>
        <line x1="439.3" y1="132" x2="439.3" y2="520" stroke="#eef3f8"></line><text x="439.3" y="544" text-anchor="middle">10</text>
        <line x1="548.7" y1="132" x2="548.7" y2="520" stroke="#eef3f8"></line><text x="548.7" y="544" text-anchor="middle">20</text>
        <line x1="658.0" y1="132" x2="658.0" y2="520" stroke="#eef3f8"></line><text x="658.0" y="544" text-anchor="middle">30</text>
        <line x1="767.3" y1="132" x2="767.3" y2="520" stroke="#eef3f8"></line><text x="767.3" y="544" text-anchor="middle">40</text>
        <line x1="876.7" y1="132" x2="876.7" y2="520" stroke="#eef3f8"></line><text x="876.7" y="544" text-anchor="middle">50</text>
        <line x1="986.0" y1="132" x2="986.0" y2="520" stroke="#eef3f8"></line><text x="986.0" y="544" text-anchor="middle">60</text>
        <line x1="1095.3" y1="132" x2="1095.3" y2="520" stroke="#eef3f8"></line><text x="1095.3" y="544" text-anchor="middle">70</text>
        <line x1="1150" y1="132" x2="1150" y2="520" stroke="#eef3f8"></line>
      </g>

      <line x1="366.1" y1="132" x2="366.1" y2="520" stroke="#9aa7b6" stroke-dasharray="4 5"></line>
      <text x="366.1" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5f6f86">random top-1 3.3%</text>

      <line x1="439.3" y1="132" x2="439.3" y2="520" stroke="#9aa7b6" stroke-dasharray="4 5"></line>
      <text x="439.3" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5f6f86">random top-3 10.0%</text>

      <line x1="632.8" y1="132" x2="632.8" y2="520" stroke="#8a5f3c" stroke-dasharray="5 5"></line>
      <text x="632.8" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a5f3c">majority-family baseline 27.7%</text>

      <g font-size="12">
        <text x="300" y="188" text-anchor="end" font-weight="700" fill="#162033">mimo-v2.5</text>
        <line x1="802.2" y1="184" x2="971.8" y2="184" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="802.2" y1="175" x2="802.2" y2="193" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="971.8" y1="175" x2="971.8" y2="193" stroke="#1e293b" stroke-width="2.2"></line>
        <circle cx="887.6" cy="184" r="7.5" fill="#2d3748"></circle>
        <circle cx="965.2" cy="184" r="7.0" fill="#ffffff" stroke="#738295" stroke-width="2.2"></circle>
        <text x="1200" y="188" font-size="11.5" fill="#162033">51.0% [43.2, 58.7]</text>
        <text x="1420" y="188" text-anchor="middle" font-size="11.5" fill="#162033">58.1%</text>

        <text x="300" y="258" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-35B-A3B</text>
        <line x1="864.6" y1="254" x2="1033.0" y2="254" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="864.6" y1="245" x2="864.6" y2="263" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="1033.0" y1="245" x2="1033.0" y2="263" stroke="#1e293b" stroke-width="2.2"></line>
        <circle cx="950.9" cy="254" r="7.5" fill="#2d3748"></circle>
        <circle cx="1098.6" cy="254" r="7.0" fill="#ffffff" stroke="#738295" stroke-width="2.2"></circle>
        <text x="1200" y="258" font-size="11.5" fill="#162033">56.8% [48.9, 64.3]</text>
        <text x="1420" y="258" text-anchor="middle" font-size="11.5" fill="#162033">70.3%</text>

        <text x="300" y="328" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-27B</text>
        <line x1="871.2" y1="324" x2="1039.5" y2="324" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="871.2" y1="315" x2="871.2" y2="333" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="1039.5" y1="315" x2="1039.5" y2="333" stroke="#1e293b" stroke-width="2.2"></line>
        <circle cx="957.5" cy="324" r="7.5" fill="#2d3748"></circle>
        <circle cx="1084.4" cy="324" r="7.0" fill="#ffffff" stroke="#738295" stroke-width="2.2"></circle>
        <text x="1200" y="328" font-size="11.5" fill="#162033">57.4% [49.5, 64.9]</text>
        <text x="1420" y="328" text-anchor="middle" font-size="11.5" fill="#162033">69.0%</text>

        <text x="300" y="398" text-anchor="end" font-weight="700" fill="#162033">Gemini 3.1 Flash Lite</text>
        <line x1="893.1" y1="394" x2="1060.4" y2="394" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="893.1" y1="385" x2="893.1" y2="403" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="1060.4" y1="385" x2="1060.4" y2="403" stroke="#1e293b" stroke-width="2.2"></line>
        <circle cx="979.4" cy="394" r="7.5" fill="#2d3748"></circle>
        <circle cx="1098.6" cy="394" r="7.0" fill="#ffffff" stroke="#738295" stroke-width="2.2"></circle>
        <text x="1200" y="398" font-size="11.5" fill="#162033">59.4% [51.5, 66.8]</text>
        <text x="1420" y="398" text-anchor="middle" font-size="11.5" fill="#162033">70.3%</text>

        <text x="300" y="468" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-397B-A17B</text>
        <line x1="907.3" y1="464" x2="1073.5" y2="464" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="907.3" y1="455" x2="907.3" y2="473" stroke="#1e293b" stroke-width="2.2"></line>
        <line x1="1073.5" y1="455" x2="1073.5" y2="473" stroke="#1e293b" stroke-width="2.2"></line>
        <circle cx="992.6" cy="464" r="7.5" fill="#2d3748"></circle>
        <circle cx="1106.2" cy="464" r="7.0" fill="#ffffff" stroke="#738295" stroke-width="2.2"></circle>
        <text x="1200" y="468" font-size="11.5" fill="#162033">60.6% [52.8, 68.0]</text>
        <text x="1420" y="468" text-anchor="middle" font-size="11.5" fill="#162033">71.0%</text>
      </g>

      <g font-size="12" fill="#5f6f86">
        <circle cx="748" cy="576" r="6.5" fill="#2d3748"></circle><text x="764" y="580">top-1 family accuracy</text>
        <circle cx="942" cy="576" r="6.5" fill="#ffffff" stroke="#738295" stroke-width="2"></circle><text x="958" y="580">top-3 family accuracy</text>
      </g>
    </svg>