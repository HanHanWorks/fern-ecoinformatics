<svg xmlns="http://www.w3.org/2000/svg" style="display:block;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" viewBox="0 0 1120 720" role="img" aria-label="Taxonomic rank collapse">
      <text x="34" y="36" font-size="22" font-weight="700" fill="#162033">Fine-grained fern identification remains outside the reliable capability boundary</text>
      <text x="34" y="60" font-size="13" fill="#5f6f86">Species_l4 subset: n=39. Family correctness stays high under the species prompt, but genus and species correctness remain very low.</text>

      <text x="54" y="106" font-size="15" font-weight="700" fill="#162033">A. Rank-collapse ladder</text>
      <text x="54" y="126" font-size="12" fill="#5f6f86">Each row links family-level correctness in the species task to genus accuracy and species exact match.</text>

      <line x1="270" y1="156" x2="958" y2="156" stroke="#d8e1eb"></line>
      <line x1="270" y1="506" x2="958" y2="506" stroke="#d8e1eb"></line>
      <g font-size="10.5" fill="#5f6f86">
        <line x1="270" y1="148" x2="270" y2="514" stroke="#eef3f8"></line><text x="270" y="530" text-anchor="middle">0</text>
        <line x1="407.6" y1="148" x2="407.6" y2="514" stroke="#eef3f8"></line><text x="407.6" y="530" text-anchor="middle">20</text>
        <line x1="545.2" y1="148" x2="545.2" y2="514" stroke="#eef3f8"></line><text x="545.2" y="530" text-anchor="middle">40</text>
        <line x1="682.8" y1="148" x2="682.8" y2="514" stroke="#eef3f8"></line><text x="682.8" y="530" text-anchor="middle">60</text>
        <line x1="820.4" y1="148" x2="820.4" y2="514" stroke="#eef3f8"></line><text x="820.4" y="530" text-anchor="middle">80</text>
        <line x1="958" y1="148" x2="958" y2="514" stroke="#eef3f8"></line><text x="958" y="530" text-anchor="middle">100%</text>
      </g>

      <g font-size="12">
        <text x="246" y="194" text-anchor="end" font-weight="700" fill="#162033">mimo-v2.5</text>
        <line x1="287.8" y1="190" x2="958.0" y2="190" stroke="#7a7a7a" stroke-width="2.8"></line>
        <circle cx="958.0" cy="190" r="7.5" fill="#7a7a7a"></circle>
        <circle cx="305.1" cy="190" r="7.0" fill="#d99100"></circle>
        <circle cx="287.8" cy="190" r="7.0" fill="#c44e52"></circle>
        <text x="978" y="194" font-size="11.5" fill="#162033">family 100.0%</text>

        <text x="246" y="262" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-27B</text>
        <line x1="287.8" y1="258" x2="958.0" y2="258" stroke="#d95f02" stroke-width="2.8"></line>
        <circle cx="958.0" cy="258" r="7.5" fill="#d95f02"></circle>
        <circle cx="323.8" cy="258" r="7.0" fill="#d99100"></circle>
        <circle cx="287.8" cy="258" r="7.0" fill="#c44e52"></circle>
        <text x="978" y="262" font-size="11.5" fill="#162033">family 100.0%</text>

        <text x="246" y="330" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-35B-A3B</text>
        <line x1="287.8" y1="326" x2="940.1" y2="326" stroke="#7570b3" stroke-width="2.8"></line>
        <circle cx="940.1" cy="326" r="7.5" fill="#7570b3"></circle>
        <circle cx="323.8" cy="326" r="7.0" fill="#d99100"></circle>
        <circle cx="287.8" cy="326" r="7.0" fill="#c44e52"></circle>
        <text x="978" y="330" font-size="11.5" fill="#162033">family 97.4%</text>

        <text x="246" y="398" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-397B-A17B</text>
        <line x1="287.8" y1="394" x2="940.1" y2="394" stroke="#1b9e77" stroke-width="2.8"></line>
        <circle cx="940.1" cy="394" r="7.5" fill="#1b9e77"></circle>
        <circle cx="323.8" cy="394" r="7.0" fill="#d99100"></circle>
        <circle cx="287.8" cy="394" r="7.0" fill="#c44e52"></circle>
        <text x="978" y="398" font-size="11.5" fill="#162033">family 97.4%</text>

        <text x="246" y="466" text-anchor="end" font-weight="700" fill="#162033">Gemini 3.1 Flash Lite</text>
        <line x1="270.0" y1="462" x2="940.1" y2="462" stroke="#e7298a" stroke-width="2.8"></line>
        <circle cx="940.1" cy="462" r="7.5" fill="#e7298a"></circle>
        <circle cx="323.8" cy="462" r="7.0" fill="#d99100"></circle>
        <circle cx="270.0" cy="462" r="7.0" fill="#c44e52"></circle>
        <text x="978" y="466" font-size="11.5" fill="#162033">family 97.4%</text>
      </g>

      <g font-size="12" fill="#5f6f86">
        <circle cx="366" cy="596" r="6.5" fill="#172033"></circle><text x="382" y="600">family accuracy under species_l4 prompt</text>
        <circle cx="366" cy="626" r="6.5" fill="#d99100"></circle><text x="382" y="630">genus accuracy 5.1%-7.7%</text>
        <circle cx="366" cy="656" r="6.5" fill="#c44e52"></circle><text x="382" y="660">species accuracy 0.0%-2.6%</text>
      </g>

      <g font-size="12" fill="#5f6f86">
        <text x="714" y="596">Genus top-3 accuracy remains low as well:</text>
        <text x="714" y="624">mimo-v2.5 5.1%</text>
        <text x="714" y="648">Qwen3.5-27B 7.7%</text>
        <text x="714" y="672">Gemini 3.1 Flash Lite 10.3%</text>
      </g>
    </svg>