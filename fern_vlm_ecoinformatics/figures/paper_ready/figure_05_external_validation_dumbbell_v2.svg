<svg xmlns="http://www.w3.org/2000/svg" style="display:block;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" viewBox="0 0 1260 820" role="img" aria-label="External validation performance">
      <text x="34" y="36" font-size="22" font-weight="700" fill="#162033">External validation is the ecological-informatics stress test</text>
      <text x="34" y="60" font-size="13" fill="#5f6f86">External dataset: 90 images, 30 candidate families × 3 images; iNaturalist n=72 and GBIF n=18.</text>

      <text x="54" y="106" font-size="15" font-weight="700" fill="#162033">A. Local direct30 versus external validation</text>
      <text x="54" y="126" font-size="12" fill="#5f6f86">All three core models lose accuracy on external images, indicating limited transfer beyond the local evaluation set.</text>

      <g font-size="10.5" fill="#5f6f86">
        <line x1="332" y1="150" x2="736" y2="150" stroke="#d8e1eb"></line>
        <line x1="332" y1="414" x2="736" y2="414" stroke="#d8e1eb"></line>
        <line x1="332" y1="142" x2="332" y2="422" stroke="#eef3f8"></line><text x="332" y="438" text-anchor="middle">30</text>
        <line x1="433" y1="142" x2="433" y2="422" stroke="#eef3f8"></line><text x="433" y="438" text-anchor="middle">40</text>
        <line x1="534" y1="142" x2="534" y2="422" stroke="#eef3f8"></line><text x="534" y="438" text-anchor="middle">50</text>
        <line x1="635" y1="142" x2="635" y2="422" stroke="#eef3f8"></line><text x="635" y="438" text-anchor="middle">60</text>
        <line x1="736" y1="142" x2="736" y2="422" stroke="#eef3f8"></line><text x="736" y="438" text-anchor="middle">70%</text>
      </g>

      <g font-size="12">
        <text x="308" y="194" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-35B-A3B</text>
        <line x1="365.7" y1="190" x2="603.7" y2="190" stroke="#7570b3" stroke-width="2.8"></line>
        <circle cx="603.7" cy="190" r="7.5" fill="#7570b3"></circle>
        <circle cx="365.7" cy="190" r="7.5" fill="#fff" stroke="#7570b3" stroke-width="2.6"></circle>
        <text x="756" y="194" font-size="11.5" fill="#162033">56.8% → 33.3%</text>

        <text x="308" y="276" text-anchor="end" font-weight="700" fill="#162033">Qwen3.5-397B-A17B</text>
        <line x1="466.0" y1="272" x2="642.0" y2="272" stroke="#1b9e77" stroke-width="2.8"></line>
        <circle cx="642.0" cy="272" r="7.5" fill="#1b9e77"></circle>
        <circle cx="466.0" cy="272" r="7.5" fill="#fff" stroke="#1b9e77" stroke-width="2.6"></circle>
        <text x="756" y="276" font-size="11.5" fill="#162033">60.6% → 43.3%</text>

        <text x="308" y="358" text-anchor="end" font-weight="700" fill="#162033">Gemini 3.1 Flash Lite</text>
        <line x1="443.8" y1="354" x2="629.9" y2="354" stroke="#e7298a" stroke-width="2.8"></line>
        <circle cx="629.9" cy="354" r="7.5" fill="#e7298a"></circle>
        <circle cx="443.8" cy="354" r="7.5" fill="#fff" stroke="#e7298a" stroke-width="2.6"></circle>
        <text x="756" y="358" font-size="11.5" fill="#162033">59.4% → 41.1%</text>
      </g>

      <g font-size="12" fill="#5f6f86">
        <circle cx="566" cy="474" r="6.5" fill="#172033"></circle><text x="582" y="478">local direct30</text>
        <circle cx="684" cy="474" r="6.5" fill="#fff" stroke="#172033" stroke-width="2"></circle><text x="700" y="478">external validation</text>
      </g>

      <text x="54" y="530" font-size="15" font-weight="700" fill="#162033">B. Source-specific external accuracy</text>
      <text x="54" y="550" font-size="12" fill="#5f6f86">GBIF contributes only 18 images, so differences between sources are descriptive and should be interpreted with wide confidence intervals.</text>
      <g font-size="12" fill="#162033">
        <text x="228" y="600" text-anchor="end" font-weight="700">Qwen3.5-35B-A3B</text>
        <rect x="250" y="586" width="75" height="16" fill="#7fb3d5"></rect><text x="336" y="599">GBIF 16.7%</text>
        <rect x="250" y="612" width="168.8" height="16" fill="#59c49a"></rect><text x="429" y="625">iNaturalist 37.5%</text>

        <text x="228" y="664" text-anchor="end" font-weight="700">Qwen3.5-397B-A17B</text>
        <rect x="250" y="650" width="149.9" height="16" fill="#7fb3d5"></rect><text x="410" y="663">GBIF 33.3%</text>
        <rect x="250" y="676" width="206.2" height="16" fill="#59c49a"></rect><text x="467" y="689">iNaturalist 45.8%</text>

        <text x="228" y="728" text-anchor="end" font-weight="700">Gemini 3.1 Flash Lite</text>
        <rect x="250" y="714" width="275.0" height="16" fill="#7fb3d5"></rect><text x="536" y="727">GBIF 61.1%</text>
        <rect x="250" y="740" width="162.4" height="16" fill="#59c49a"></rect><text x="423" y="753">iNaturalist 36.1%</text>
      </g>

      <text x="826" y="106" font-size="15" font-weight="700" fill="#162033">C. Descriptive family-level external extremes</text>
      <text x="826" y="126" font-size="12" fill="#5f6f86">Each family contributes 9 model-image evaluations across the three core models. These rows are descriptive rather than inferential.</text>

      <g font-size="12" fill="#162033">
        <text x="826" y="172" font-weight="700" fill="#1b9e77">Higher-performing families</text>
        <text x="826" y="204">Marsileaceae</text><rect x="964" y="190" width="240" height="16" fill="#27a57f"></rect><text x="1216" y="203" fill="#5f6f86">9/9</text>
        <text x="826" y="234">Hymenophyllaceae</text><rect x="964" y="220" width="240" height="16" fill="#27a57f"></rect><text x="1216" y="233" fill="#5f6f86">9/9</text>
        <text x="826" y="264">Lycopodiaceae</text><rect x="964" y="250" width="240" height="16" fill="#27a57f"></rect><text x="1216" y="263" fill="#5f6f86">9/9</text>
        <text x="826" y="294">Psilotaceae</text><rect x="964" y="280" width="240" height="16" fill="#27a57f"></rect><text x="1216" y="293" fill="#5f6f86">9/9</text>
        <text x="826" y="324">Gleicheniaceae</text><rect x="964" y="310" width="213.3" height="16" fill="#5cb891"></rect><text x="1216" y="323" fill="#5f6f86">8/9</text>
        <text x="826" y="354">Polypodiaceae</text><rect x="964" y="340" width="213.3" height="16" fill="#5cb891"></rect><text x="1216" y="353" fill="#5f6f86">8/9</text>

        <text x="826" y="420" font-weight="700" fill="#c44e52">Lower-performing families</text>
        <text x="826" y="452">Tectariaceae</text><rect x="964" y="438" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="451" fill="#5f6f86">0/9</text>
        <text x="826" y="482">Marattiaceae</text><rect x="964" y="468" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="481" fill="#5f6f86">0/9</text>
        <text x="826" y="512">Arthropteridaceae</text><rect x="964" y="498" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="511" fill="#5f6f86">0/9</text>
        <text x="826" y="542">Osmundaceae</text><rect x="964" y="528" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="541" fill="#5f6f86">0/9</text>
        <text x="826" y="572">Didymochlaenaceae</text><rect x="964" y="558" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="571" fill="#5f6f86">0/9</text>
        <text x="826" y="602">Hypodematiaceae</text><rect x="964" y="588" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="601" fill="#5f6f86">0/9</text>
        <text x="826" y="632">Athyriaceae</text><rect x="964" y="618" width="4" height="16" fill="#c44e52"></rect><text x="1216" y="631" fill="#5f6f86">0/9</text>
      </g>
    </svg>